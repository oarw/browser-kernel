name: checkpoint-pilot
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 330
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.checkpoint.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - run: python kernel/preflight.py --work-dir D:\fb-kernel --phase prepare --output release/preflight.json
      - run: python kernel/download_source.py --work-dir D:\fb-kernel
        timeout-minutes: 15
      - shell: pwsh
        timeout-minutes: 150
        run: |
          python -u kernel/build_windows.py --work-dir D:\fb-kernel --jobs 2 --build-timeout-minutes 10 --checkpoint-on-timeout
          if ($LASTEXITCODE -ne 124) { throw "Expected a checkpoint slice; exit code: $LASTEXITCODE" }
          exit 0
      - id: checkpoint
        run: python kernel/checkpoint.py create --work-dir D:\fb-kernel --output release/checkpoint
        timeout-minutes: 50
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 30
        with:
          name: checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: release/checkpoint/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/state | Out-Null
          if (Test-Path release/preflight.json) { Copy-Item -LiteralPath release/preflight.json -Destination release/state/host-preflight.json }
          foreach ($name in @('build-state.json', 'build-result.json', 'prepared.json', 'preflight-prepare.json', 'preflight-build.json')) {
            $path = Join-Path 'D:\fb-kernel' $name
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination release/state }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capture-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/state/
          retention-days: 7
          if-no-files-found: warn

  resume:
    needs: capture
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      MANIFEST_SHA256: ${{ needs.capture.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 30
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          merge-multiple: true
          path: release/checkpoint
      - run: python kernel/checkpoint.py restore --work-dir D:\fb-kernel --source release/checkpoint --manifest-sha256 "$env:MANIFEST_SHA256"
        timeout-minutes: 50
      - run: python kernel/preflight.py --work-dir D:\fb-kernel --phase build --output release/preflight.json
      - run: python kernel/download_source.py --work-dir D:\fb-kernel
        timeout-minutes: 15
      - shell: pwsh
        timeout-minutes: 20
        run: |
          python -u kernel/build_windows.py --work-dir D:\fb-kernel --jobs 2 --build-timeout-minutes 10 --checkpoint-on-timeout
          if ($LASTEXITCODE -ne 124) { throw "Expected a checkpoint slice; exit code: $LASTEXITCODE" }
          exit 0
      - run: python kernel/checkpoint.py verify-progress --work-dir D:\fb-kernel --source release/checkpoint --manifest-sha256 "$env:MANIFEST_SHA256" --output release/result.json
      - if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/state | Out-Null
          foreach ($path in @('release/result.json', 'release/preflight.json')) {
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination release/state }
          }
          foreach ($name in @('build-state.json', 'build-result.json', 'prepared.json', 'preflight-prepare.json', 'preflight-build.json')) {
            $path = Join-Path 'D:\fb-kernel' $name
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination release/state }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/state/
          retention-days: 7
          if-no-files-found: warn
