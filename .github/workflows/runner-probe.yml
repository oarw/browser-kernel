name: runner-probe
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [windows-2022, windows-2025]
        default: windows-2022

permissions:
  contents: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.fixture.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - run: python kernel/runner_probe.py --output release/probe/resources.json
      - id: fixture
        run: python kernel/artifact_probe.py create --output release/probe
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/probe/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  restore:
    needs: capture
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          merge-multiple: true
          path: release/downloaded
      - run: python kernel/artifact_probe.py verify --source release/downloaded --output release/restored --manifest-sha256 "$env:MANIFEST_SHA256" --require-clean-job
        env:
          MANIFEST_SHA256: ${{ needs.capture.outputs.manifest_sha256 }}
      - run: python kernel/runner_probe.py --output release/restored/resources.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/restored/*.json
            release/downloaded/resources.json
          retention-days: 7
          if-no-files-found: error
      - shell: pwsh
        run: |
          $reports = @('release/downloaded/resources.json', 'release/restored/resources.json')
          foreach ($path in $reports) {
            $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if (-not $report.ready) { throw ($report.issues -join '; ') }
          }
