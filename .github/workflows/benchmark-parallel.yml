name: benchmark-parallel
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful build-kernel source run'
        type: string
        required: true
      source_attempt:
        description: 'Source run attempt'
        type: string
        required: true
      source_commit:
        description: 'Source full commit SHA'
        type: string
        required: true
      source_artifact:
        description: 'Exact checkpoint artifact ID'
        type: string
        required: true
      manifest_sha256:
        description: 'Verified manifest SHA-256'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 210
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - name: Verify checkpoint source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python kernel/checkpoint_source.py --run-id "$env:SOURCE_RUN" --attempt "$env:SOURCE_ATTEMPT" --commit "$env:SOURCE_COMMIT" --artifact-id "$env:SOURCE_ARTIFACT" --manifest-sha256 "$env:MANIFEST_SHA256" --output release/trusted-source.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 20
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          artifact-ids: ${{ inputs.source_artifact }}
          merge-multiple: true
          path: D:\benchmark-source
      - name: Trial 1 - three jobs
        timeout-minutes: 45
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python -u kernel/benchmark_parallel.py --source D:\benchmark-source --trusted-source release/trusted-source.json --manifest-sha256 "$env:MANIFEST_SHA256" --output release/benchmark --trial 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-after-trial-1
          path: release/
          retention-days: 90
          if-no-files-found: error
      - name: Trial 2 - four jobs
        timeout-minutes: 45
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python -u kernel/benchmark_parallel.py --source D:\benchmark-source --trusted-source release/trusted-source.json --manifest-sha256 "$env:MANIFEST_SHA256" --output release/benchmark --trial 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-after-trial-2
          path: release/
          retention-days: 90
          if-no-files-found: error
      - name: Trial 3 - four jobs
        timeout-minutes: 45
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python -u kernel/benchmark_parallel.py --source D:\benchmark-source --trusted-source release/trusted-source.json --manifest-sha256 "$env:MANIFEST_SHA256" --output release/benchmark --trial 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-after-trial-3
          path: release/
          retention-days: 90
          if-no-files-found: error
      - name: Trial 4 - three jobs
        timeout-minutes: 45
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python -u kernel/benchmark_parallel.py --source D:\benchmark-source --trusted-source release/trusted-source.json --manifest-sha256 "$env:MANIFEST_SHA256" --output release/benchmark --trial 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          retention-days: 90
          if-no-files-found: error
