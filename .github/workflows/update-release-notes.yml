name: update-release-notes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing kernel Release tag to regenerate detailed notes'
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update existing release notes without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python kernel/release_notes.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
