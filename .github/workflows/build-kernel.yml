name: build-kernel
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Previous successful build run ID (leave all source fields empty for a fresh build)'
        type: string
      source_attempt:
        description: 'Previous run attempt'
        type: string
      source_commit:
        description: 'Previous run full commit SHA'
        type: string
      source_artifact:
        description: 'Exact checkpoint artifact ID'
        type: string
      manifest_sha256:
        description: 'Manifest SHA-256 verified from the previous build state artifact'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Start budget
        shell: pwsh
        run: '"BUILD_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''o''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r kernel/requirements.txt
      - name: Validate recovery inputs
        shell: pwsh
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          $values = @($env:SOURCE_RUN, $env:SOURCE_ATTEMPT, $env:SOURCE_COMMIT, $env:SOURCE_ARTIFACT, $env:MANIFEST_SHA256)
          $provided = @($values | Where-Object { $_ -ne '' }).Count
          if ($provided -notin @(0, 5)) { throw 'Provide all five recovery inputs or leave all empty' }
      - name: Verify checkpoint source
        if: inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python kernel/checkpoint_source.py --run-id "$env:SOURCE_RUN" --attempt "$env:SOURCE_ATTEMPT" --commit "$env:SOURCE_COMMIT" --artifact-id "$env:SOURCE_ARTIFACT" --manifest-sha256 "$env:MANIFEST_SHA256" --output release/trusted-source.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.source_run != ''
        timeout-minutes: 15
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          artifact-ids: ${{ inputs.source_artifact }}
          merge-multiple: true
          path: release/source-checkpoint
      - name: Restore verified checkpoint
        if: inputs.source_run != ''
        timeout-minutes: 45
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python kernel/checkpoint.py restore --work-dir D:\fb-kernel --source release/source-checkpoint --manifest-sha256 "$env:MANIFEST_SHA256" --trusted-source release/trusted-source.json
      - name: Validate restored precompiled headers
        if: inputs.source_run != ''
        timeout-minutes: 15
        run: python kernel/pch_recovery.py --work-dir D:\fb-kernel --output release/pch-recovery.json
      - run: python kernel/preflight.py --work-dir D:\fb-kernel --phase prepare --output release/preflight.json
        if: inputs.source_run == ''
      - run: python kernel/download_source.py --work-dir D:\fb-kernel
        timeout-minutes: 15
      - run: python -u kernel/build_windows.py --work-dir D:\fb-kernel --jobs 2 --prepare-only
        if: inputs.source_run == ''
        timeout-minutes: 150
      - name: Migrate reviewed checkpoint inputs
        if: inputs.source_run != ''
        timeout-minutes: 20
        run: python -u kernel/build_windows.py --work-dir D:\fb-kernel --jobs 2 --prepare-only --migrate-prepared
      - id: budget
        run: python kernel/build_budget.py --started-at "$env:BUILD_STARTED_AT" --output release/budget.json
      - id: compile
        name: Compile chrome
        shell: pwsh
        timeout-minutes: 310
        env:
          COMPILE_MINUTES: ${{ steps.budget.outputs.minutes }}
        run: |
          python -u kernel/build_windows.py --work-dir D:\fb-kernel --jobs 2 --build-timeout-minutes $env:COMPILE_MINUTES --checkpoint-on-timeout
          $code = $LASTEXITCODE
          if ($code -notin @(0, 124)) { throw "Build failed with exit code $code" }
          $state = Get-Content -Raw -LiteralPath D:\fb-kernel\build-state.json | ConvertFrom-Json
          if (($code -eq 0 -and $state.status -ne 'built') -or ($code -eq 124 -and $state.status -ne 'checkpoint-ready')) {
            throw 'Build exit code and state disagree'
          }
          "status=$($state.status)" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Verify resumed progress
        if: inputs.source_run != ''
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python kernel/checkpoint.py verify-progress --work-dir D:\fb-kernel --source release/source-checkpoint --manifest-sha256 "$env:MANIFEST_SHA256" --output release/resume-progress.json
      - id: checkpoint
        run: python kernel/checkpoint.py create --work-dir D:\fb-kernel --output release/checkpoint
        timeout-minutes: 35
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: release/checkpoint/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Collect state
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/state | Out-Null
          foreach ($path in @('release/budget.json', 'release/preflight.json', 'release/checkpoint/manifest.json', 'release/trusted-source.json', 'release/resume-progress.json', 'release/pch-recovery.json')) {
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination release/state }
          }
          foreach ($name in @('build-state.json', 'build-result.json', 'prepared.json', 'preflight-prepare.json', 'preflight-build.json', 'migration.json')) {
            $path = Join-Path 'D:\fb-kernel' $name
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination release/state }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: build-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/state/
          retention-days: 7
          if-no-files-found: warn
