name: checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'kernel/third-party-licenses/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'kernel/third-party-licenses/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m unittest discover -s kernel/tests -v
      - run: node --test
      - run: node --check scripts/verify-kernel.mjs
      - if: runner.os == 'Linux'
        run: python kernel/check_patch.py --output release/source-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'Linux'
        with:
          name: source-check
          path: release/source-check/report.json
          retention-days: 7
          if-no-files-found: error
